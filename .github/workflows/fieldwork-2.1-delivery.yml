name: Fieldwork 2.1 atomic delivery

on:
  pull_request:
    branches:
      - AI-2.0
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  deliver:
    if: github.head_ref == 'agent/2.1-live-sandbox-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .delivery/fieldwork-2.1.part-00)" = "18000"
          test "$(wc -c < .delivery/fieldwork-2.1.part-01)" = "10488"
          test "$(sha256sum .delivery/fieldwork-2.1.part-00 | cut -d' ' -f1)" = "6e1eb7279fce898299c6c494a02192402356116e10fb9b6432c387d857d228b2"
          test "$(sha256sum .delivery/fieldwork-2.1.part-01 | cut -d' ' -f1)" = "ae5810d3d5f3b02d947af75e7badc6904c141d896ded998894fe598c5ea0b239"
          cat .delivery/fieldwork-2.1.part-00 .delivery/fieldwork-2.1.part-01 > /tmp/fieldwork-2.1.patch.xz.b64
          test "$(sha256sum /tmp/fieldwork-2.1.patch.xz.b64 | cut -d' ' -f1)" = "46a9d423449629dc698f6fb968bc1bf2061537b6db8b28c682d387947a0d1fb3"
          base64 --decode /tmp/fieldwork-2.1.patch.xz.b64 > /tmp/fieldwork-2.1.patch.xz
          xz --test /tmp/fieldwork-2.1.patch.xz
          xz --decompress --stdout /tmp/fieldwork-2.1.patch.xz > /tmp/fieldwork-2.1.patch
          test -s /tmp/fieldwork-2.1.patch

      - name: Apply Fieldwork 2.1 to current AI-2.0
        shell: bash
        env:
          EXPECTED_SHA: ca36c31763bc9d1df5e349d764b2bb84ba0a14b2
        run: |
          set -euo pipefail
          git fetch origin AI-2.0
          test "$(git rev-parse origin/AI-2.0)" = "$EXPECTED_SHA"
          git reset --hard origin/AI-2.0
          git apply --index --whitespace=nowarn /tmp/fieldwork-2.1.patch
          if [ -f .github/workflows/fieldwork-2.1-ingest.yml ]; then git rm .github/workflows/fieldwork-2.1-ingest.yml; fi
          test -n "$(git diff --cached --name-only)"

      - name: Validate repository
        run: npm test

      - name: Commit directly to AI-2.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Fieldwork 2.1 — Authority-Constrained Live Sandbox" -m "Add the dedicated live sandbox, explicit actor action arbitration, three persistent faction rosters, twelve changing objectives, scored operation selection, continuous operation turnover, campaign progression fields, live controls and authority diagnostics, plus long-running invariants."
          git push origin HEAD:AI-2.0

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          if [ -f .github/workflows/fieldwork-2.1-ingest.yml ]; then
            git rm .github/workflows/fieldwork-2.1-ingest.yml
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git commit -m "Remove temporary Fieldwork 2.1 ingest workflow"
            git push origin HEAD:main
          fi

      - name: Remove staging branch
        if: success()
        run: git push origin --delete agent/2.1-live-sandbox-staging || true
