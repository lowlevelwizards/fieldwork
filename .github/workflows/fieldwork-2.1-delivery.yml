name: Fieldwork 2.1 atomic delivery

on:
  push:
    branches:
      - agent/2.1-live-sandbox-staging

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .delivery/fieldwork-2.1.part-* > /tmp/fieldwork-2.1.patch.xz.b64
          base64 --decode /tmp/fieldwork-2.1.patch.xz.b64 | xz --decompress > /tmp/fieldwork-2.1.patch
          test -s /tmp/fieldwork-2.1.patch

      - name: Verify target and apply Fieldwork 2.1
        shell: bash
        env:
          BASE_SHA: cc489224c454dea3305a0d31b16691dfd22e0152
        run: |
          set -euo pipefail
          git fetch origin AI-2.0
          test "$(git rev-parse origin/AI-2.0)" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git apply --index --whitespace=nowarn /tmp/fieldwork-2.1.patch
          test -n "$(git diff --cached --name-only)"

      - name: Validate repository
        run: npm test

      - name: Commit directly to AI-2.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Fieldwork 2.1 — Authority-Constrained Live Sandbox" -m "Add the dedicated live sandbox, explicit actor action arbitration, three persistent faction rosters, twelve changing objectives, scored operation selection, continuous operation turnover, campaign progression fields, live controls and authority diagnostics, plus long-running invariants."
          git push origin HEAD:AI-2.0

      - name: Remove staging branch
        if: success()
        shell: bash
        run: git push origin --delete agent/2.1-live-sandbox-staging
