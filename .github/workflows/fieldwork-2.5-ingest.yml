name: Fieldwork 2.5 ingest

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  deliver:
    if: github.event.pull_request.head.ref == 'AI-2.0-staging-3.1ef-retry'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live AI branch
        uses: actions/checkout@v4
        with:
          ref: AI-2.0
          fetch-depth: 0

      - name: Reconstruct and overlay Fieldwork AI 3.1E-F payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin AI-2.0-staging-3.1ef-retry
          : > /tmp/fieldwork-ai-3.1ef.zip.b64
          for part in 00 01 02 03 04 05 06 07; do
            git show "origin/AI-2.0-staging-3.1ef-retry:.delivery/fieldwork-ai-3.1ef.part${part}" >> /tmp/fieldwork-ai-3.1ef.zip.b64
          done
          base64 --decode /tmp/fieldwork-ai-3.1ef.zip.b64 > /tmp/fieldwork-ai-3.1ef.zip
          unzip -o /tmp/fieldwork-ai-3.1ef.zip -d .
          git add -A

      - name: Commit directly to AI-2.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          if git diff --cached --quiet; then
            echo "No changes to apply."
          else
            git commit -m "AI 3.1E-F spatial intent and concern staffing" -m "Add stable capability-based staffing for concurrent team concerns, actor-sized spatial intent fields, direct live concern fulfillment, concern/effect bindings for compatibility procedures, intent diagnostics, and rejected cover-slot cleanup. Preserve exact coordinates for finite cover and physical interaction affordances."
            git push origin HEAD:AI-2.0
          fi

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git rm .github/workflows/fieldwork-2.5-ingest.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Remove temporary AI 3.1E-F ingest workflow"
          git push origin HEAD:main

      - name: Close staging PR and remove branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr close "$PR_URL" --delete-branch
