name: Verified AI 3.1E-F ingest

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-ai-3.1ef-ingest
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out live AI branch
        uses: actions/checkout@v4
        with:
          ref: AI-2.0
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          set -euo pipefail

          STAGING='AI-2.0-staging-3.1ef-retry'
          B64='/tmp/fieldwork-ai-3.1ef.zip.b64'
          ZIP='/tmp/fieldwork-ai-3.1ef.zip'
          ROOT='/tmp/fieldwork-ai-3.1ef'
          PATCH_ROOT="$ROOT/fieldwork-ai-3.1E-3.1F-changed-files"

          git fetch origin "$STAGING:refs/remotes/origin/$STAGING"
          : > "$B64"
          for part in $(seq -w 0 15); do
            git show "origin/$STAGING:.delivery/fieldwork-ai-3.1ef.part${part}" >> "$B64"
          done

          test "$(wc -c < "$B64" | tr -d ' ')" = '89132'
          echo '9ad143a204d6a44c7ded352ba3e2e1fac82b6481fa919365209cd9c5b7f0f9ae  /tmp/fieldwork-ai-3.1ef.zip.b64' | sha256sum -c -

          base64 --decode "$B64" > "$ZIP"
          echo '812c52460103d53d11cf04bada5051683eb33a68490232f53ffc6d6e3ee103d7  /tmp/fieldwork-ai-3.1ef.zip' | sha256sum -c -

          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q "$ZIP" -d "$ROOT"

          test -d "$PATCH_ROOT"
          echo 'd134f511036b169fcafa49247853efc4497eb42d9af9cc64fcd353032f79067b  /tmp/fieldwork-ai-3.1ef/fieldwork-ai-3.1E-3.1F-changed-files/CHANGED_FILES.txt' | sha256sum -c -
          test "$(grep -cve '^[[:space:]]*$' "$PATCH_ROOT/CHANGED_FILES.txt")" = '22'

          while IFS= read -r file || [ -n "$file" ]; do
            [ -n "$file" ] || continue
            case "$file" in
              /*|*'..'*) echo "Unsafe manifest path: $file" >&2; exit 1 ;;
            esac
            test -f "$PATCH_ROOT/$file"
            mkdir -p "$(dirname "$file")"
            cp "$PATCH_ROOT/$file" "$file"
            git add -- "$file"
          done < "$PATCH_ROOT/CHANGED_FILES.txt"

          sort "$PATCH_ROOT/CHANGED_FILES.txt" > /tmp/expected-files.txt
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-syntax.mjs
          node tools/check-imports.mjs
          node --test \
            tests/ai-v2-concern-staffing.test.mjs \
            tests/ai-v2-spatial-intent-fields.test.mjs \
            tests/ai-v2-unified-actor-brain.test.mjs \
            tests/ai-v2-single-execution-gateway.test.mjs

      - name: Commit atomically to AI-2.0
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'AI 3.1E-F is already present; no commit needed.'
            exit 0
          fi

          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'AI 3.1E-F spatial intent and concern staffing' \
            -m 'Add stable capability-based staffing, actor-sized spatial intent fields, direct concern fulfillment, runtime integration, diagnostics, and exact-affordance cleanup.'
          git push origin HEAD:AI-2.0
