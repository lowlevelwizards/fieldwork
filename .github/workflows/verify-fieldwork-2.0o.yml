name: Verify Fieldwork 2.0O

on:
  push:
    branches:
      - agent/fieldwork-2.0o-safe-retry-20260803

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fieldwork-2.0o-safe-retry-20260803
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full regression suite
        run: npm test
      - name: Remove one-use verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-fieldwork-2.0o.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Fieldwork 2.0O verifier"
          git push origin HEAD:agent/fieldwork-2.0o-safe-retry-20260803
