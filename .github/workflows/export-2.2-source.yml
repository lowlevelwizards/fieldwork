name: Export Fieldwork 2.2 source

on:
  pull_request:
    branches: [AI-2.0]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/2.3-source-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -qr /tmp/fieldwork-2.2-source.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: fieldwork-2.2-source
          path: /tmp/fieldwork-2.2-source.zip
          if-no-files-found: error
          retention-days: 1
