name: Fieldwork 2.1 ingest

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  deliver:
    if: github.event.pull_request.head.ref == 'agent/2.1-live-sandbox-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out AI-2.0
        uses: actions/checkout@v4
        with:
          ref: AI-2.0
          fetch-depth: 0

      - name: Reconstruct and apply verified 2.1 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/2.1-live-sandbox-staging
          git show origin/agent/2.1-live-sandbox-staging:.delivery/fieldwork-2.1.part-00 > /tmp/part-00
          git show origin/agent/2.1-live-sandbox-staging:.delivery/fieldwork-2.1.part-01 > /tmp/part-01
          cat /tmp/part-00 /tmp/part-01 > /tmp/fieldwork-2.1.patch.xz.b64
          base64 --decode /tmp/fieldwork-2.1.patch.xz.b64 | xz --decompress > /tmp/fieldwork-2.1.patch
          git apply --index --whitespace=nowarn /tmp/fieldwork-2.1.patch
          git rm .github/workflows/fieldwork-2.1-ingest.yml

      - name: Validate
        run: npm test

      - name: Commit directly to AI-2.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Fieldwork 2.1 — Authority-Constrained Live Sandbox" -m "Add the dedicated live sandbox, explicit action arbitration, persistent faction rosters, changing objectives, scored operation selection, world turnover, progression fields, live controls, diagnostics, and soak coverage."
          git push origin HEAD:AI-2.0

      - name: Clean up staging PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr close "$PR_URL" --delete-branch
