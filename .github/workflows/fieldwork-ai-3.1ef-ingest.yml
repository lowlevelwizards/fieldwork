name: Fieldwork AI 3.1E-F ingest

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  deliver:
    if: github.event.pull_request.head.ref == 'AI-2.0-staging-3.1ef-retry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out live AI branch
        uses: actions/checkout@v4
        with:
          ref: AI-2.0
          fetch-depth: 0

      - name: Reconstruct and verify AI 3.1E-F payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin AI-2.0-staging-3.1ef-retry
          : > /tmp/fieldwork-ai-3.1ef.zip.b64
          for part in 00 01 02 03 04 05 06 07; do
            git show "origin/AI-2.0-staging-3.1ef-retry:.delivery/fieldwork-ai-3.1ef.part${part}" >> /tmp/fieldwork-ai-3.1ef.zip.b64
          done

          test "$(wc -c < /tmp/fieldwork-ai-3.1ef.zip.b64 | tr -d ' ')" = "79424"
          printf '%s  %s\n' '736ea5056fcb5e1e35734a1cb2c0469fda2a805e0ba04659539e7677441bcfb5' '/tmp/fieldwork-ai-3.1ef.zip.b64' | sha256sum -c -
          base64 --decode /tmp/fieldwork-ai-3.1ef.zip.b64 > /tmp/fieldwork-ai-3.1ef.zip
          printf '%s  %s\n' '7aae2003b17cb2a15ad8dd0cbed4f0036deb35368081709d90a4282f8d6b6c5f' '/tmp/fieldwork-ai-3.1ef.zip' | sha256sum -c -
          unzip -tq /tmp/fieldwork-ai-3.1ef.zip

          python - <<'PY'
          import zipfile
          expected = sorted([
              'CHANGELOG.md',
              'PATCH_NOTES.txt',
              'docs/architecture/24_SPATIAL_INTENT_FIELDS_CONCERN_STAFFING.md',
              'docs/releases/3.1E_3.1F_SPATIAL_INTENT_FIELDS_CONCERN_STAFFING.md',
              'js/ai-v2/README.md',
              'js/ai-v2/actions/move-to-objective-position-action.js',
              'js/ai-v2/actions/move-within-intent-field-action.js',
              'js/ai-v2/actions/reposition-for-responsibility-action.js',
              'js/ai-v2/actors/concern-fulfillment-runtime.js',
              'js/ai-v2/actors/operational-travel-runtime.js',
              'js/ai-v2/actors/role-action-runtime.js',
              'js/ai-v2/actors/unified-actor-brain.js',
              'js/ai-v2/decisions/team-concern-board.js',
              'js/ai-v2/decisions/team-concern-staffing-service.js',
              'js/ai-v2/diagnostics/ai-debug-projection.js',
              'js/ai-v2/execution/locomotion-executor.js',
              'js/ai-v2/execution/tactical-steering-service.js',
              'js/ai-v2/position/position-slot-claim-service.js',
              'js/ai-v2/position/spatial-intent-field-service.js',
              'js/ai-v2/runtime/ai-runtime.js',
              'tests/ai-v2-concern-staffing.test.mjs',
              'tests/ai-v2-spatial-intent-fields.test.mjs',
          ])
          with zipfile.ZipFile('/tmp/fieldwork-ai-3.1ef.zip') as archive:
              actual = sorted(name for name in archive.namelist() if not name.endswith('/'))
          if actual != expected:
              raise SystemExit(f'Unexpected payload manifest:\nexpected={expected}\nactual={actual}')
          print(f'Payload manifest verified: {len(actual)} files')
          PY

          unzip -oq /tmp/fieldwork-ai-3.1ef.zip -d .

      - name: Validate AI 3.1E-F overlay
        shell: bash
        run: |
          set -euo pipefail
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test \
            tests/ai-v2-concern-staffing.test.mjs \
            tests/ai-v2-spatial-intent-fields.test.mjs \
            tests/ai-v2-unified-actor-brain.test.mjs \
            tests/ai-v2-single-execution-gateway.test.mjs

      - name: Commit directly to AI-2.0
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fieldwork-ai-3.1ef-manifest.txt <<'EOF'
          CHANGELOG.md
          PATCH_NOTES.txt
          docs/architecture/24_SPATIAL_INTENT_FIELDS_CONCERN_STAFFING.md
          docs/releases/3.1E_3.1F_SPATIAL_INTENT_FIELDS_CONCERN_STAFFING.md
          js/ai-v2/README.md
          js/ai-v2/actions/move-to-objective-position-action.js
          js/ai-v2/actions/move-within-intent-field-action.js
          js/ai-v2/actions/reposition-for-responsibility-action.js
          js/ai-v2/actors/concern-fulfillment-runtime.js
          js/ai-v2/actors/operational-travel-runtime.js
          js/ai-v2/actors/role-action-runtime.js
          js/ai-v2/actors/unified-actor-brain.js
          js/ai-v2/decisions/team-concern-board.js
          js/ai-v2/decisions/team-concern-staffing-service.js
          js/ai-v2/diagnostics/ai-debug-projection.js
          js/ai-v2/execution/locomotion-executor.js
          js/ai-v2/execution/tactical-steering-service.js
          js/ai-v2/position/position-slot-claim-service.js
          js/ai-v2/position/spatial-intent-field-service.js
          js/ai-v2/runtime/ai-runtime.js
          tests/ai-v2-concern-staffing.test.mjs
          tests/ai-v2-spatial-intent-fields.test.mjs
          EOF

          while IFS= read -r file; do
            git add -- "$file"
          done < /tmp/fieldwork-ai-3.1ef-manifest.txt

          git diff --cached --name-only | sort > /tmp/fieldwork-ai-3.1ef-staged.txt
          sort /tmp/fieldwork-ai-3.1ef-manifest.txt > /tmp/fieldwork-ai-3.1ef-expected.txt
          diff -u /tmp/fieldwork-ai-3.1ef-expected.txt /tmp/fieldwork-ai-3.1ef-staged.txt

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          if git diff --cached --quiet; then
            echo "No changes to apply."
          else
            git commit \
              -m "AI 3.1E-F spatial intent and concern staffing" \
              -m "Add stable capability-based staffing for concurrent team concerns, actor-sized spatial intent fields, direct live concern fulfillment, concern/effect bindings for compatibility procedures, intent diagnostics, and rejected cover-slot cleanup. Preserve exact coordinates for finite cover and physical interaction affordances."
            git push origin HEAD:AI-2.0
          fi

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git rm .github/workflows/fieldwork-ai-3.1ef-ingest.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Remove temporary AI 3.1E-F ingest workflow"
          git push origin HEAD:main

      - name: Close staging PR and remove branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr close "$PR_URL" --delete-branch
