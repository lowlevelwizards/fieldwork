name: AI 3.2G focused validation

on:
  pull_request:
    branches: [AI-2.0]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate G module graph and focused regressions
        run: |
          node tools/check-syntax.mjs
          node tools/check-imports.mjs
          node --test \
            tests/ai-v2-contact-route-decision.test.mjs \
            tests/ai-v2-contact-route-epistemic.test.mjs \
            tests/ai-v2-contact-route-liveness.test.mjs \
            tests/ai-v2-contact-route-live.test.mjs \
            tests/ai-v2-contact-resolution.test.mjs \
            tests/ai-v2-route-intent.test.mjs \
            tests/ai-v2-route-field-handoff.test.mjs
      - name: Package exact changed files
        run: |
          mkdir -p staging/js/ai-v2/actions staging/js/ai-v2/actors staging/js/ai-v2/decisions staging/js/ai-v2/encounters staging/js/ai-v2/position staging/tests
          cp js/ai-v2/actions/circumvent-contact-action.js staging/js/ai-v2/actions/
          cp js/ai-v2/actors/contact-resolution-runtime.js staging/js/ai-v2/actors/
          cp js/ai-v2/actors/operational-travel-runtime.js staging/js/ai-v2/actors/
          cp js/ai-v2/decisions/contact-route-decision-state.js staging/js/ai-v2/decisions/
          cp js/ai-v2/encounters/contact-resolution-service.js staging/js/ai-v2/encounters/
          cp js/ai-v2/position/contact-route-plan-service.js staging/js/ai-v2/position/
          cp tests/ai-v2-contact-route-decision.test.mjs staging/tests/
          cp tests/ai-v2-contact-route-epistemic.test.mjs staging/tests/
          cp tests/ai-v2-contact-route-live.test.mjs staging/tests/
          cp tests/ai-v2-contact-route-liveness.test.mjs staging/tests/
          cd staging
          zip -r ../fieldwork-3.2G-contact-route-decision-changed-files.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: fieldwork-3.2G-contact-route-decision-changed-files
          path: fieldwork-3.2G-contact-route-decision-changed-files.zip
          if-no-files-found: error
