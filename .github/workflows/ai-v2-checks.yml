name: AI V2 checks

on:
  push:
    branches:
      - AI-2.0
  pull_request:
    branches:
      - AI-2.0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax, import, and regression checks
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: test-output.txt
          if-no-files-found: error
      - name: Report validated tree
        if: success()
        run: git rev-parse HEAD^{tree}
